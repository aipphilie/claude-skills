<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
// 3D-предметы для рилса «Он выбрал тебя»: сердце, дом, кольца, цветок (вянет), часы
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const W = innerWidth, H = innerHeight;
const R = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true, alpha: true});
R.setSize(W, H); R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
R.setClearColor(0, 0); document.body.appendChild(R.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0, 0, 12); cam.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x999999, 1.5));
const k = new THREE.DirectionalLight(0xffffff, 2.6); k.position.set(4, 6, 8); scene.add(k);
const r2 = new THREE.DirectionalLight(0xffffff, 1.0); r2.position.set(-6, 2, -4); scene.add(r2);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: 0.38, metalness: 0}, o));
const RED = M(0xE8344A), PINK = M(0xFF4F8B), GOLD = M(0xFFC21A, {metalness: 0.55, roughness: 0.25}), YEL = M(0xFFD60A),
      WH = M(0xf4f2ee), INK = M(0x1a1a1a), GREEN = M(0x2fae5a), GLASS = M(0xFFE680, {emissive: 0xFFC800, emissiveIntensity: 0.6});
function heartGeo() {
  const s = new THREE.Shape(); s.moveTo(0, -1.6);
  s.bezierCurveTo(-0.6, -1.0, -2.0, -0.2, -2.0, 0.7); s.bezierCurveTo(-2.0, 1.7, -0.7, 2.1, 0, 1.2);
  s.bezierCurveTo(0.7, 2.1, 2.0, 1.7, 2.0, 0.7); s.bezierCurveTo(2.0, -0.2, 0.6, -1.0, 0, -1.6);
  const g = new THREE.ExtrudeGeometry(s, {depth: 0.7, bevelEnabled: true, bevelThickness: 0.35, bevelSize: 0.3, bevelSegments: 10, curveSegments: 40});
  g.center(); return g;
}
const HEART = heartGeo();
let obj = null;
function mix(a, b, t) { return a + (b - a) * t; }
const build = {
  heart(p) { const m = new THREE.Mesh(HEART, p.gray ? M(0x9a9a9a) : RED); const g = new THREE.Group(); g.add(m); g.scale.setScalar(1.25 * (p.beat || 1)); return g; },
  rings(p) {
    const g = new THREE.Group();
    const a = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.26, 32, 80), GOLD); a.position.x = -0.7; a.rotation.y = 0.5;
    const b = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.26, 32, 80), GOLD); b.position.x = 0.7; b.rotation.y = -0.5; b.rotation.x = 0.4;
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.42), M(0xffffff, {metalness: 0.1, roughness: 0.05, emissive: 0x88ccff, emissiveIntensity: 0.25}));
    gem.position.set(-0.7, 1.55, 0); g.add(a, b, gem); return g;
  },
  house(p) {
    const g = new THREE.Group(); const u = p.grow ?? 1;
    const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 2.6), WH); body.position.y = -0.9; g.add(body);
    const roofS = new THREE.Shape(); roofS.moveTo(-1.95, 0); roofS.lineTo(0, 1.6); roofS.lineTo(1.95, 0); roofS.lineTo(-1.95, 0);
    const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofS, {depth: 3.0, bevelEnabled: false}), INK); roof.position.set(0, 0.3, -1.5); g.add(roof);
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.3, 0.1), INK); door.position.set(-0.7, -1.45, 1.31); g.add(door);
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 0.1), GLASS); win.position.set(0.75, -0.75, 1.31); g.add(win);
    const pipe = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.0, 0.45), INK); pipe.position.set(1.0, 1.25, -0.4); g.add(pipe);
    const hm = new THREE.Mesh(HEART, RED); hm.scale.setScalar(0.14); hm.position.set(0, 0.85, 1.4); g.add(hm);
    g.scale.set(1, u, 1); g.position.y = -1.6 * (1 - u); return g;
  },
  flower(p) {   // wilt 0..1: стебель гнётся, лепестки вянут и опадают
    const g = new THREE.Group(); const w = p.wilt || 0; const bloom = p.bloom ?? 1;
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 0.75, 1.4, 40), YEL); pot.position.y = -2.4; g.add(pot);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(1.12, 1.12, 0.3, 40), YEL); rim.position.y = -1.7; g.add(rim);
    const soil = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.05, 40), INK); soil.position.y = -1.54; g.add(soil);
    const bend = w * 1.5;
    const top = new THREE.Vector3(Math.sin(bend) * 2.2, -1.5 + Math.cos(bend) * 2.2 * (1 - w * 0.15), 0);
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, -1.5, 0), new THREE.Vector3(0, 0.3 - w * 0.8, 0), top);
    const stemC = new THREE.Color(0x2fae5a).lerp(new THREE.Color(0x8a7a3a), w);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 30, 0.11, 10), M(stemC)));
    for (const [t, sd] of [[0.4, -1], [0.55, 1]]) {   // листья
      const lp = curve.getPoint(t); const lf = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 12), M(stemC));
      lf.scale.set(1, 0.32, 0.5); lf.position.copy(lp).add(new THREE.Vector3(sd * 0.42, 0, 0)); lf.rotation.z = sd * (0.5 + w * 1.2); g.add(lf);
    }
    const head = new THREE.Group(); head.position.copy(top); head.rotation.z = -bend * 1.1; g.add(head);
    const petC = new THREE.Color(0xFF4F8B).lerp(new THREE.Color(0x8b6a55), w);
    const n = 8;
    for (let i = 0; i < n; i++) {
      const fall = Math.max(0, w * 1.6 - 0.35 - i * 0.09);   // опадание по одному
      const a = i / n * Math.PI * 2;
      const pt = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), M(petC)); pt.scale.set(1, 0.5, 0.25);
      pt.position.set(Math.cos(a) * 0.62 * bloom, Math.sin(a) * 0.62 * bloom, 0); pt.rotation.z = a;
      pt.scale.multiplyScalar(bloom);
      if (fall > 0) { const f = Math.min(fall, 1.0); const dx = Math.sin(i * 2.1) * f * 1.2, dy = -f * 3.2, ra = bend * 1.1;
        pt.position.x += dx * Math.cos(ra) - dy * Math.sin(ra); pt.position.y += dx * Math.sin(ra) + dy * Math.cos(ra); pt.rotation.x = f * 3; }
      head.add(pt);
    }
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.36 * Math.max(0.3, bloom), 20, 14), M(new THREE.Color(0xFFD60A).lerp(new THREE.Color(0x6b5a2a), w)));
    c.position.z = 0.12; head.add(c);
    g.position.y = 0.6; g.scale.setScalar(1.15); return g;
  },
  clock(p) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.5, 60), YEL); body.rotation.x = Math.PI / 2; g.add(body);
    const face = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.55, 0.52, 60), WH); face.rotation.x = Math.PI / 2; g.add(face);
    for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.28, 0.1), INK); const a = i / 12 * Math.PI * 2; m.position.set(Math.sin(a) * 1.3, Math.cos(a) * 1.3, 0.3); m.rotation.z = -a; g.add(m); }
    const hand = (len, a, w) => { const h = new THREE.Mesh(new THREE.BoxGeometry(w, len, 0.08), INK); h.geometry.translate(0, len / 2, 0); h.position.z = 0.34; h.rotation.z = -a; g.add(h); };
    hand(1.2, (p.tick || 0) * Math.PI * 2, 0.12); hand(0.8, (p.tick || 0) * Math.PI / 6, 0.18);
    const bell = (sd) => { const b = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), INK); b.position.set(sd * 1.2, 1.7, 0); b.rotation.z = -sd * 0.6; g.add(b); };
    bell(-1); bell(1); return g;
  },
};
window.prop = function (p) {
  if (obj) scene.remove(obj);
  obj = build[p.kind](p);
  obj.rotation.y = (p.ry || 0) * Math.PI / 180; obj.rotation.x = (p.rx || 0) * Math.PI / 180; obj.rotation.z = (p.rz || 0) * Math.PI / 180;
  scene.add(obj); R.render(scene, cam); return true;
};
window.ready = true;
</script></body></html>
