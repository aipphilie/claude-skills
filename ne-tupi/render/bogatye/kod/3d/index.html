<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true, alpha: true});
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null; renderer.setClearColor(0x000000, 0);
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xdddddd, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, 18, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left: -14, right: 14, top: 18, bottom: -8, near: 1, far: 60});
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.2);
rim.position.set(-8, 8, -6);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({opacity: 0.12}));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

let ink = new THREE.MeshStandardMaterial({color: 0x161616, roughness: 0.55, metalness: 0.0});
let white = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.6, emissive: 0x666666});
const gray = new THREE.MeshStandardMaterial({color: 0xcfcfcf, roughness: 0.7});

// пропорции из 2D-рига (пиксели / 100)
let BODY_W = 1.9, GAP = 0.22, LEG_R = (BODY_W - GAP) / 4, LEG_L = 4.0;
let TORSO_H = 4.0;
const ARM_R = 0.28, UPPER = 1.75, FORE = 1.65, HEAD_R = 1.3;
const DEPTH = 0.62;   // сплющивание корпуса по глубине

function cap(r, len) {           // капсула по оси Y, от 0 до len
  const g = new THREE.CapsuleGeometry(r, Math.max(0.001, len), 16, 64);
  g.translate(0, len / 2, 0);
  return g;
}
function segment(a, b, r, mat = ink) {   // капсула между точками a и b
  const v = new THREE.Vector3().subVectors(b, a), len = v.length();
  const m = new THREE.Mesh(cap(r, len), mat);
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v.clone().normalize());
  m.castShadow = true;
  return m;
}
const rad = d => d * Math.PI / 180;
// угол от вертикали вниз, side: -1 лево, +1 право; fwd — вынос вперёд
function dir(ang, side, fwd = 0) {
  return new THREE.Vector3(side * Math.sin(rad(ang)), -Math.cos(rad(ang)), fwd).normalize();
}

function mouth(kind) {
  const g = new THREE.Group();
  if (kind === 'rest' || kind === 'sad' || kind === 'M') {
    const s = kind === 'sad' ? -1 : (kind === 'M' ? 0 : 1);
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-0.34, 0, 0), new THREE.Vector3(0, -0.2 * s, 0), new THREE.Vector3(0.34, 0, 0));
    const t = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.045, 10), white);
    g.add(t);
  } else {
    const dims = {A: [0.44, 0.46], E: [0.5, 0.2], O: [0.25, 0.31], U: [0.14, 0.16], smile: [0.54, 0.36], wow: [0.22, 0.36]}[kind];
    const shape = new THREE.Shape();
    if (kind === 'A' || kind === 'E' || kind === 'smile') {     // плоский верх, круглый низ
      const [w, h] = dims;
      shape.moveTo(-w, 0); shape.quadraticCurveTo(0, 0.05, w, 0);
      shape.bezierCurveTo(w, -h * 1.2, -w, -h * 1.2, -w, 0);
    } else {
      shape.absellipse(0, -dims[1] * 0.5, dims[0], dims[1], 0, Math.PI * 2);
    }
    const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, {depth: 0.04, bevelEnabled: false}), white);
    g.add(m);
  }
  return g;
}

// мягкое пятно тени под ногами (для плоского стиля, как в 2D)
const blobTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,0.16)'); gr.addColorStop(0.6, 'rgba(0,0,0,0.08)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({map: blobTex, transparent: true, depthWrite: false}));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.01; blob.visible = false;
scene.add(blob);
let fig = null;
// стили: real — объёмный с бликами; flat — плоский силуэт как в 2D; toon — плоский с мультяшной тенью
const REAL = [ink, white];
function toonRamp(levels) {
  const d = new Uint8Array(levels.flatMap(v => [v, v, v, 255]));
  const t = new THREE.DataTexture(d, levels.length, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
}
window.setStyle = function (s) {
  if (s === 'real') { [ink, white] = REAL; key.castShadow = true; blob.visible = false; }
  if (s === 'flat') { key.castShadow = false; blob.visible = true; ink = new THREE.MeshBasicMaterial({color: 0x111111}); white = new THREE.MeshBasicMaterial({color: 0xffffff}); }
  if (s === 'toon') {
    ink = new THREE.MeshToonMaterial({color: 0x333333, gradientMap: toonRamp([60, 60, 60, 160, 160])});
    white = new THREE.MeshBasicMaterial({color: 0xffffff});
  }
  return true;
};
window.pose = function (p = {}) {
  p = Object.assign({la: [20, 2], ra: [20, 2], head: 0, mouth: 'rest', yaw: 0, lean: 0, laF: 0, raF: 0, dy: 0, sink: 0, llift: 0, rlift: 0, lsw: 0, rsw: 0, head_dy: 0, pitch: 0}, p);
  if (fig) scene.remove(fig);
  BODY_W = 1.9 * (p.bw || 1); LEG_R = (BODY_W - GAP) / 4; LEG_L = 4.0 * (p.lh || 1); TORSO_H = 4.0 * (p.th || 1);
  fig = new THREE.Group();
  const crotchY = LEG_L + LEG_R + p.dy - p.sink;

  // ноги
  for (const side of [-1, 1]) {
    const x = side * (GAP / 2 + LEG_R);
    const lift = side < 0 ? p.llift : p.rlift, sw = rad(side < 0 ? p.lsw : p.rsw);
    const L = LEG_L - p.sink - lift;          // от промежности до центра стопы
    const foot = new THREE.Vector3(x, crotchY - L * Math.cos(sw), L * Math.sin(sw) + lift * 0.8);
    fig.add(segment(foot, new THREE.Vector3(x, crotchY, 0), LEG_R));
  }

  const upper = new THREE.Group();
  upper.position.y = crotchY;
  upper.rotation.z = rad(-p.lean); upper.rotation.x = rad(p.pitch);
  fig.add(upper);

  // корпус: цилиндр + купол сверху, сплющенный по глубине
  const r = BODY_W / 2, cylH = TORSO_H - r;
  const torso = new THREE.Group();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, cylH, 48), ink);
  cyl.position.y = cylH / 2; cyl.castShadow = true;
  const dome = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), ink);
  dome.position.y = cylH; dome.castShadow = true;
  torso.add(cyl, dome);
  torso.scale.z = DEPTH;
  upper.add(torso);

  // руки от плеч, вписанных в купол
  for (const [side, [a1, a2], f] of [[-1, p.la, p.laF], [1, p.ra, p.raF]]) {
    const d = r - ARM_R, a = rad(62);
    const sh = new THREE.Vector3(side * d * Math.sin(a), cylH + d * Math.cos(a) - 0.18, 0);
    const el = sh.clone().add(dir(a1, side, f * 0.5).multiplyScalar(UPPER));
    const ha = el.clone().add(dir(a1 + a2, side, f).multiplyScalar(FORE));
    upper.add(segment(sh, el, ARM_R), segment(el, ha, ARM_R));
  }

  // голова
  const neck = new THREE.Group();
  neck.position.y = TORSO_H;
  neck.rotation.z = rad(-p.head);
  upper.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R, 64, 48), ink);
  head.position.y = HEAD_R - 0.18 - p.head_dy; head.castShadow = true;
  neck.add(head);
  const m = mouth(p.mouth);
  // рот на поверхности сферы, чуть ниже центра
  const my = -0.45, mz = Math.sqrt(HEAD_R * HEAD_R - my * my);
  m.position.set(0, head.position.y + my + 0.02, mz - 0.01);
  m.lookAt(0, head.position.y + my * 2.2, mz * 3);
  neck.add(m);
  if (p.helmet) {   // жёлтая каска сварщика с поднятыми тёмными очками
    const ym = new THREE.MeshBasicMaterial({color: 0xFFD60A, toneMapped: false}), km = new THREE.MeshBasicMaterial({color: 0x111111});
    const hg = new THREE.Group(); hg.position.y = head.position.y + 0.12; neck.add(hg);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R * 1.08, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), ym); hg.add(dome);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(HEAD_R * 1.32, HEAD_R * 1.32, 0.12, 48), ym); brim.position.set(0, 0.02, 0.12); hg.add(brim);
    const line = new THREE.Mesh(new THREE.CylinderGeometry(HEAD_R * 1.09, HEAD_R * 1.09, 0.07, 48), km); line.position.y = 0.11; hg.add(line);
    const vis = new THREE.Mesh(new THREE.BoxGeometry(HEAD_R * 1.1, HEAD_R * 0.32, 0.12), km);
    vis.position.set(0, HEAD_R * 0.42, HEAD_R * 0.93); vis.rotation.x = -0.45; hg.add(vis);
  }

  if (p.girl) {   // девушка: чёрное каре до плеч + розовый бант
    const pm = new THREE.MeshBasicMaterial({color: 0xFF4F8B, toneMapped: false});
    const hg = new THREE.Group(); hg.position.y = head.position.y; neck.add(hg);
    const cap_ = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R * 1.1, 48, 32), ink); cap_.position.set(0, 0.06, -0.12); cap_.scale.z = 0.95; hg.add(cap_);
    for (const side of [-1, 1]) {   // пряди по бокам до плеч
      const lock = new THREE.Mesh(cap(0.42, HEAD_R * 1.05), ink); lock.position.set(side * HEAD_R * 0.84, -HEAD_R * 1.2, -0.1);
      lock.rotation.z = side * 0.12; hg.add(lock);
    }
    const back_ = new THREE.Mesh(cap(HEAD_R * 0.98, HEAD_R * 0.75), ink); back_.position.set(0, -HEAD_R * 1.05, -0.45); back_.scale.z = 0.6; hg.add(back_);
    const bow = new THREE.Group(); bow.position.set(HEAD_R * 0.62, HEAD_R * 0.86, 0.25); bow.rotation.z = -0.5; hg.add(bow);
    for (const side of [-1, 1]) {
      const w = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.62, 24), pm); w.rotation.z = side * Math.PI / 2; w.position.x = side * 0.3; bow.add(w);
    }
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), pm); bow.add(knot);
  }

  if (p.dad) {   // отец: серая кепка + светлые усы
    const gm = new THREE.MeshBasicMaterial({color: 0x9A968E, toneMapped: false}), gd = new THREE.MeshBasicMaterial({color: 0x6E6A64, toneMapped: false}), wm = new THREE.MeshBasicMaterial({color: 0xF2F0EA, toneMapped: false});
    const hg = new THREE.Group(); hg.position.y = head.position.y + 0.42; hg.rotation.x = 0.12; neck.add(hg);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(HEAD_R * 1.1, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), gm); dome.scale.y = 0.62; hg.add(dome);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(HEAD_R * 1.1, HEAD_R * 1.02, 0.16, 48), gd); band.position.y = -0.02; hg.add(band);
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(HEAD_R * 0.85, HEAD_R * 0.85, 0.1, 48), gd); brim.scale.z = 0.75; brim.position.set(0, -0.04, HEAD_R * 0.95); hg.add(brim);
    const btn = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), gd); btn.position.y = HEAD_R * 0.68; hg.add(btn);
    const uy = -0.02, uz = Math.sqrt(HEAD_R * HEAD_R - uy * uy);
    for (const side of [-1, 1]) {
      const u = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 16), wm); u.scale.set(1.5, 0.55, 0.5);
      u.position.set(side * 0.36, head.position.y + uy - 0.1, uz - 0.02); u.rotation.z = -side * 0.35; neck.add(u);
    }
  }
  if (p.rich) {   // богач: золотая корона набок + белая сигара
    const gm = new THREE.MeshBasicMaterial({color: 0xF4BE1E, toneMapped: false}), gd = new THREE.MeshBasicMaterial({color: 0xBA840A, toneMapped: false}), rm = new THREE.MeshBasicMaterial({color: 0xE42C34, toneMapped: false});
    const wm = new THREE.MeshBasicMaterial({color: 0xF2F0EA, toneMapped: false}), om = new THREE.MeshBasicMaterial({color: 0xFF7A1A, toneMapped: false});
    const hg = new THREE.Group(); hg.position.set(0.25, head.position.y + HEAD_R * 0.86, 0); hg.rotation.z = -0.28; neck.add(hg);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(HEAD_R * 0.62, HEAD_R * 0.66, 0.5, 40, 1, true), gm); band.material.side = THREE.DoubleSide; hg.add(band);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(HEAD_R * 0.66, 0.07, 10, 40), gd); rim.rotation.x = Math.PI / 2; rim.position.y = -0.25; hg.add(rim);
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * Math.PI * 2; const sp = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.62, 12), gm);
      sp.position.set(Math.sin(a) * HEAD_R * 0.6, 0.5, Math.cos(a) * HEAD_R * 0.6); hg.add(sp);
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), gd); b.position.set(Math.sin(a) * HEAD_R * 0.6, 0.83, Math.cos(a) * HEAD_R * 0.6); hg.add(b);
    }
    const gem = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), rm); gem.position.set(0, 0, HEAD_R * 0.66); hg.add(gem);
    const cy_ = head.position.y - 0.5, cz = Math.sqrt(HEAD_R * HEAD_R - 0.25);
    const cig = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 1.0, 16), wm); cig.rotation.z = Math.PI / 2 + 0.25; cig.position.set(0.85, cy_ - 0.05, cz + 0.05); neck.add(cig);
    const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.125, 0.16, 16), om); tip.rotation.z = Math.PI / 2 + 0.25; tip.position.set(0.85 + 0.58 * 0.97, cy_ - 0.05 + 0.58 * 0.25, cz + 0.05); neck.add(tip);
  }
  fig.rotation.y = rad(p.yaw);
  const bs = Math.max(0.45, 1 - p.dy * 0.12); blob.scale.set(5.2 * bs, 2.2 * bs, 1);
  scene.add(fig);

  camera.position.set(0, 6.4, 34);
  camera.lookAt(0, 5.6, 0);
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body></html>
